<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>🤖 J.A.R.V.I.S.</header>

  <main id="chat">
    <div class="mensagem ia">
      <strong>Olá! 👋</strong><br><br>
      Faça uma pergunta. A IA será configurada para mostrar a
      <strong>resposta primeiro</strong> e a <strong>explicação depois</strong>.
    </div>
  </main>

  <form id="areaInput">
    <input id="pergunta" type="text" placeholder="Digite sua pergunta..." autocomplete="off">
    <button id="botaoEnviar" type="submit">Enviar</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
